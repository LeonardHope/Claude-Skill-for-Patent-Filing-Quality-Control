name: tests

# Runs the QC regression suite on every PR and on pushes to main/next. A stale
# branch that deletes checks (e.g. the IDS checks) will fail the relevant
# tests and block the merge.
on:
  push:
    branches: [main, next]
  pull_request:

jobs:
  regression-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # PyPDF2 is a hard import in the script; pdfplumber is the primary text
        # extractor. python-docx + fpdf2 let the .docx-abstract and
        # locate-hyphenation tests actually run (they skip gracefully if
        # absent, but we want them exercised in CI). The OCR deps
        # (pytesseract/pdf2image) are intentionally omitted — the suite stubs
        # OCR, and leaving them out keeps OCR_AVAILABLE False for default paths.
        run: |
          python -m pip install --upgrade pip
          pip install "PyPDF2>=3.0" "pdfplumber>=0.11" "python-docx>=1.0" "fpdf2>=2.7"

      - name: Run QC regression suite
        run: python tests/test_qc_patent_filing.py

      - name: Run core/viewer parity suite (when present)
        # tests/test_core.py + core/ only exist on next (and any branch that has
        # merged the v2 viewer). Guard on the file so this same workflow is a
        # no-op on main today and starts enforcing skill/viewer parity
        # automatically if/when next is merged into main.
        run: |
          if [ -f tests/test_core.py ]; then
            python tests/test_core.py
          else
            echo "tests/test_core.py not present on this branch; skipping"
          fi
